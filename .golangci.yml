---
version: "2"

linters:
  default: none
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  settings:
    govet:
      # The `inline` analyzer is a refactoring aid, not a correctness check: it
      # reports call sites it could not rewrite because the callee's stdlib is
      # newer than the `go` directive in go.mod. That is a property of the
      # toolchain the linter was built with, not of this code, so the findings
      # move whenever the linter is rebuilt. `go vet ./...` stays clean.
      disable:
      - inline
  exclusions:
    rules:
    # The provider still registers resources/data sources with the deprecated
    # non-context SDKv2 CRUD fields (Create/Read/Update/Delete). Migrating all of
    # them to the Context variants is tracked separately; silence the deprecation
    # warning until then.
    - linters:
      - staticcheck
      text: "SA1019"
